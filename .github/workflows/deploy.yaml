# Deploys OnicaiBot to OpenChat's EC2 host, where it runs for now beside OpenChat's MiniApp service,
# bridges and bots: tests the bot, pushes its image to OpenChat's ECR as `latest`, then restarts it
# there, and it pulls `latest` as it starts. Its config, including its identity, stays as it is in
# SSM Parameter Store, and its games in its data file on the host. This repo can push the bot's
# image and restart it, but run nothing else on the host: the restart is a fixed SSM document, and
# the host's unit and start script, in aws/, are installed by OpenChat. See "Deploying" in the
# README.
on:
  workflow_dispatch:
  # Tests and builds it, without deploying
  pull_request:
    branches:
      - main

name: Deploy OnicaiBot

# Deploys queue behind each other, apart from a PR's builds, which a newer push to the PR cancels
concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && 'deploy' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: 253040722768.dkr.ecr.us-east-1.amazonaws.com/oc-onicai-bot
  INSTANCE_ID: i-0198f9d466e519454

jobs:
  deploy:
    name: Deploy OnicaiBot
    # The host is arm64, so this builds its image natively rather than under emulation
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      # The deploy role can only be assumed from main, so this fails early with a clearer error
      - name: Ensure on main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Deploy from main, not ${GITHUB_REF}"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Test
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run check
      - name: Build
        run: docker build --platform linux/arm64 -t "$IMAGE:${GITHUB_SHA::10}" -t "$IMAGE:latest" .
      - name: Configure AWS credentials
        if: github.event_name == 'workflow_dispatch'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::253040722768:role/GitHubActions-DeployOnicaiBot
          aws-region: us-east-1
      # The bot's public url is in its own config, so it's kept in one place. It's read before
      # anything's pushed, so a missing parameter or permission stops the deploy there.
      - name: Read the public url
        if: github.event_name == 'workflow_dispatch'
        run: |
          public_url=$(aws ssm get-parameter --name /oc-onicai-bot/PUBLIC_URL --query Parameter.Value --output text)
          echo "PUBLIC_URL=${public_url%/}" >> "$GITHUB_ENV"
      - name: Push
        if: github.event_name == 'workflow_dispatch'
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "${IMAGE%%/*}"
          docker push "$IMAGE:${GITHUB_SHA::10}"
          docker push "$IMAGE:latest"
      # A restart drops the pages' requests in flight, which they retry, and the races carry on from
      # the bot's data file. The deploy fails if the bot doesn't start and stay up; systemd keeps
      # restarting it.
      - name: Restart the bot
        if: github.event_name == 'workflow_dispatch'
        run: |
          # A command the host doesn't pick up within 60s is dropped, rather than restarting the
          # bot later, after this run has given up on it
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name oc-onicai-bot-restart \
            --timeout-seconds 60 --comment "Deploy OnicaiBot at ${GITHUB_SHA::10}" \
            --query Command.CommandId --output text)
          # Up to 5 minutes, for the pull and the 30s check. The invocation may not exist at first.
          for _ in $(seq 60); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null) || status=Pending
            case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Restart: $status"
          [ "$status" = Success ]
      # The definition is what OpenChat reads to register the bot, so it's what must be served
      - name: Check it's up
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$PUBLIC_URL/bot_definition" > /dev/null
          echo "Deployed ${GITHUB_SHA} and it's serving ${PUBLIC_URL}"
